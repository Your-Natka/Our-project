<header class="header">
  <div class="container header__container">
    <a class="header__logo" href="./index.html" aria-label="YourEnergy home page">
      <svg class="header__logo-icon" width="132" height="14" aria-hidden="true">
        <use href="./img/sprite.svg#icon-logo"></use>
      </svg>
    </a>


    <nav class="header__nav" aria-label="Primary">
      <ul class="header__nav-list">
        <li>
          <a class="header__nav-link {=$highlight-home}" href="./index.html">Home</a>
        </li>
        <li>
          <a class="header__nav-link {=$highlight-favorites}" href="./favorites.html">Favorites</a>
        </li>
      </ul>
    </nav>

    <ul class="header__socials" aria-label="Social media">
      <li>
        <a class="header__social-link" href="https://www.facebook.com/goITclub/" target="_blank"
          rel="noopener noreferrer" aria-label="Facebook">
          <svg class="header__social-icon" width="18" height="18" aria-hidden="true">
            <use href="./img/sprite.svg#icon-facebook"></use>
          </svg>
        </a>
      </li>
      <li>
        <a class="header__social-link" href="https://www.instagram.com/goitclub/" target="_blank"
          rel="noopener noreferrer" aria-label="Instagram">
          <svg class="header__social-icon" width="18" height="18" aria-hidden="true">
            <use href="./img/sprite.svg#icon-instagram"></use>
          </svg>
        </a>
      </li>
      <li>
        <a class="header__social-link" href="https://www.youtube.com/c/GoIT" target="_blank" rel="noopener noreferrer"
          aria-label="YouTube">
          <svg class="header__social-icon" width="18" height="18" aria-hidden="true">
            <use href="./img/sprite.svg#icon-youtube"></use>
          </svg>
        </a>
      </li>
    </ul>

    <button type="button" class="header__burger" aria-label="Open menu" aria-controls="mobile-menu"
      aria-expanded="false" data-menu-open>
      <svg class="header__burger-icon" width="24" height="24" aria-hidden="true">
        <use href="./img/sprite.svg#icon-menu"></use>
      </svg>
    </button>
  </div>

  <div id="mobile-menu" class="mobile-menu" aria-hidden="true" data-menu>
    <div class="mobile-menu__panel">
      <button type="button" class="mobile-menu__close" aria-label="Close menu" data-menu-close>
        <svg class="mobile-menu__close-icon" width="24" height="24" aria-hidden="true">
          <use href="./img/sprite.svg#icon-cross"></use>
        </svg>
      </button>

      <nav class="mobile-menu__nav" aria-label="Mobile primary">
        <ul class="mobile-menu__nav-list">
          <li>
            <a class="mobile-menu__nav-link {=$highlight-home}" href="./index.html">Home</a>
          </li>
          <li>
            <a class="mobile-menu__nav-link {=$highlight-favorites}" href="./favorites.html">Favorites</a>
          </li>
        </ul>
      </nav>

      <ul class="mobile-menu__socials" aria-label="Social media">
        <li>
          <a class="mobile-menu__social-link" href="https://www.facebook.com/goITclub/" target="_blank"
            rel="noopener noreferrer" aria-label="Facebook">
            <svg class="mobile-menu__social-icon" width="18" height="18" aria-hidden="true">
              <use href="./img/sprite.svg#icon-facebook"></use>
            </svg>
          </a>
        </li>
        <li>
          <a class="mobile-menu__social-link" href="https://www.instagram.com/goitclub/" target="_blank"
            rel="noopener noreferrer" aria-label="Instagram">
            <svg class="mobile-menu__social-icon" width="18" height="18" aria-hidden="true">
              <use href="./img/sprite.svg#icon-instagram"></use>
            </svg>
          </a>
        </li>
        <li>
          <a class="mobile-menu__social-link" href="https://www.youtube.com/c/GoIT" target="_blank"
            rel="noopener noreferrer" aria-label="YouTube">
            <svg class="mobile-menu__social-icon" width="18" height="18" aria-hidden="true">
              <use href="./img/sprite.svg#icon-youtube"></use>
            </svg>
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>

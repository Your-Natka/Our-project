<section class="categories-section" id="categories-section">
  <div class="container">
    
    <!-- Заголовна панель: Заголовок секції + Кнопки-фільтри -->
    <div class="categories-navigation">
      <h2 class="categories-title" id="categories-title">
        Exercises<span class="categories-subtitle" id="categories-subtitle"></span>
      </h2>
      
      <!-- Кнопки-фільтри -->
      <ul class="filter-list" role="tablist">
        <li class="filter-item">
          <button class="filter-btn active" type="button" data-filter="Muscles" aria-selected="true" role="tab">
            Muscles
          </button>
        </li>
        <li class="filter-item">
          <button class="filter-btn" type="button" data-filter="Body parts" aria-selected="false" role="tab">
            Body parts
          </button>
        </li>
        <li class="filter-item">
          <button class="filter-btn" type="button" data-filter="Equipment" aria-selected="false" role="tab">
            Equipment
          </button>
        </li>
      </ul>
    </div>

    <!-- Основний контент: Сітка категорій -->
    <div class="categories-content">
      <!-- Зберігаємо оригінальний клас Наталі, але стилізуємо його як Grid -->
      <ul class="categories-list" id="categories-list">
        <!-- Картки категорій рендеряться динамічно через JS/TS -->
      </ul>

      <!-- Блок для помилки або порожнього результату -->
      <div class="categories-error is-hidden" id="categories-error">
        <p class="error-text">Категорій не знайдено. Спробуйте пізніше</p>
      </div>
      
      <!-- Контейнер для пагінації категорій -->
      <div class="pagination-container" id="categories-pagination"></div>
    </div>
    
  </div>
</section>

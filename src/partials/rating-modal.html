<div class="rating-backdrop is-hidden">
  <div class="rating-modal">
    <button class="rating-close-btn" type="button">✕</button>

    <form class="rating-form">
      <p class="rating-label">Rating</p>

      <div class="rating-wrapper">
        <span class="rating-value">0.0</span>

        <div class="rating-stars">
          <label class="star-label">
            <input
              type="radio"
              name="rate"
              value="1"
              aria-label="1 star rating"
            />
            <svg class="star-icon" width="18" height="18">
              <use href="./sprite.svg#icon-star"></use>
            </svg>
          </label>

          <label class="star-label">
            <input
              type="radio"
              name="rate"
              value="2"
              aria-label="2 star rating"
            />
            <svg class="star-icon" width="18" height="18">
              <use href="./sprite.svg#icon-star"></use>
            </svg>
          </label>

          <label class="star-label">
            <input
              type="radio"
              name="rate"
              value="3"
              aria-label="3 star rating"
            />
            <svg class="star-icon" width="18" height="18">
              <use href="./sprite.svg#icon-star"></use>
            </svg>
          </label>

          <label class="star-label">
            <input
              type="radio"
              name="rate"
              value="4"
              aria-label="4 star rating"
            />
            <svg class="star-icon" width="18" height="18">
              <use href="./sprite.svg#icon-star"></use>
            </svg>
          </label>

          <label class="star-label">
            <input
              type="radio"
              name="rate"
              value="5"
              aria-label="5 star rating"
            />
            <svg class="star-icon" width="18" height="18">
              <use href="./sprite.svg#icon-star"></use>
            </svg>
          </label>
        </div>
      </div>

      <input
        class="rating-input"
        type="email"
        name="email"
        aria-label="Email"
        required
        pattern="^\w+(\.\w+)?@[a-zA-Z_]+?\.[a-zA-Z]{2,3}$"
        placeholder="Email"
      />

      <textarea
        class="rating-textarea"
        name="review"
        aria-label="Review"
        required
        placeholder="Your review"
      ></textarea>

      <button class="rating-submit-btn" type="submit">Send</button>
    </form>
  </div>
</div>

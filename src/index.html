<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>YOUR ENERGY</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Modern Normalize -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main styles -->
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <load
      src="./partials/header.html"
      icon-path="img/sprite.svg"
      highlight-home="active"
      highlight-favorites=""
    />

    <main class="container">
      <load src="./partials/hero.html" />

      <!-- Спільна навігація сторінки (універсальний заголовок та фільтри) -->
      <nav class="section-navigation">
        <h2 class="section-title" id="section-title" style="cursor: pointer; user-select: none;">
          Exercises<span class="section-subtitle" id="section-subtitle"></span>
        </h2>

        <!-- Пошукове поле -->
        <div class="search-box is-hidden" id="section-search-box">
          <input type="text" placeholder="Search" class="search-input" />
          <button class="search-btn">
            <svg width="24" height="24">
              <use href="./assets/sprite.svg#icon-search" /> <!-- ІКОНКА НАРАЗІ ВІДСУТНЯ -->
            </svg>
          </button>
        </div>

        <!-- Кнопки-фільтри -->
        <ul class="filter-list" role="tablist" id="section-filter-list">
          <li class="filter-item">
            <button class="filter-btn active" type="button" data-filter="Muscles" aria-selected="true" role="tab">
              Muscles
            </button>
          </li>
          <li class="filter-item">
            <button class="filter-btn" type="button" data-filter="Body parts" aria-selected="false" role="tab">
              Body parts
            </button>
          </li>
          <li class="filter-item">
            <button class="filter-btn" type="button" data-filter="Equipment" aria-selected="false" role="tab">
              Equipment
            </button>
          </li>
        </ul>
      </nav>

      <div class="home-layout-wrapper">
        <load src="./partials/exercises.html" />

        <load src="./partials/quote.html" />
      </div>
    </main>

    <load src="./partials/footer.html" />

    <script type="module" src="./main.js"></script>
  </body>
</html>
